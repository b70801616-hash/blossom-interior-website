<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Blossom Interior & Decorator</title>
<style>
  :root{
    --paper:#EFEAE0;
    --ink:#24261F;
    --ink-soft:#4A4B3F;
    --moss:#45543C;
    --white:#FBF9F4;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:20px;
  }
  .error-container{
    text-align:center;
    max-width:600px;
  }
  h1{
    font-size:4rem;
    margin:0 0 16px;
    color:var(--moss);
  }
  p{
    font-size:1.1rem;
    color:var(--ink-soft);
    margin:0 0 32px;
    line-height:1.6;
  }
  a{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:12px 24px;
    background:var(--moss);
    color:var(--white);
    text-decoration:none;
    border-radius:2px;
    font-weight:500;
    transition:background 0.2s ease;
  }
  a:hover{
    background:#333F2C;
  }
</style>
</head>
<body>
<div class="error-container">
  <h1>404</h1>
  <p>Oops! The page you're looking for doesn't exist. But don't worry, we're here to help with all your interior design needs.</p>
  <a href="/">← Back to Home</a>
</div>
</body>
</html>
